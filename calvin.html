<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Parkir</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0077cc;
      color: white;
      padding: 20px;
    }

    .container {
      margin-top: 50px;
    }

    .card {
      background: white;
      width: 300px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    button {
      background: #0077cc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sistem Parkir</h1>
    <p>Website sederhana parkiran kendaraan</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>Status Parkir</h2>
      <p>Slot tersedia: <span id="slot">10</span></p>

      <button onclick="kurangiSlot()">
        Parkir Masuk
      </button>
    </div>
  </div>

  <script>
    let slot = 10;

    function kurangiSlot() {
      if (slot > 0) {
        slot--;
        document.getElementById("slot").innerText = slot;
      } else {
        alert("Parkiran penuh!");
      }
    }
  </script>

</body>
</html>
